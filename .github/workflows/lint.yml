name: lint

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  # nightly_devbuild.yml calls this workflow on the cron so lint and the pilot
  # tests run at night, without a second copy of the steps. The call takes no
  # input: inside a called workflow the github context is the caller's, so the
  # job gates below read the caller's event name.
  workflow_call:

concurrency:
  # Key each master push on its commit SHA so every merge lands in its own
  # concurrency group. Sharing one group serializes master runs, and with
  # cancel-in-progress disabled GitHub still cancels a pending run when the
  # next merge queues behind the one in progress, so a later merge would
  # drop an earlier merge's result. A unique group per SHA keeps every
  # master run independent. Pull requests key on the PR number and other
  # branches on the ref, so their superseded runs still cancel.
  #
  # Name this workflow directly, not through github.workflow. Under a
  # workflow_call that holds the caller's name, so the devbuild and lint calls
  # would share one group. A nightly call keys on the workflow rather than the
  # commit: its github.ref and github.sha are master's, so a nightly that
  # starts while the master push run is still in flight would queue behind it.
  # Ref: https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
  group: lint-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  check_skip:
    uses: ./.github/workflows/check_skip_ci.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read

  lint:

    name: Run make lint and pilot on ${{ matrix.os }}

    needs: [check_skip]

    if: |
      needs.check_skip.outputs.skip != 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       ((vars.SCGH_PUSH_RUN_BRANCH || vars.MMGH_PUSH_RUN_BRANCH) == '*' ||
        contains(vars.SCGH_PUSH_RUN_BRANCH || vars.MMGH_PUSH_RUN_BRANCH, github.ref_name))))

    runs-on: ${{ matrix.os }}

    timeout-minutes: ${{ fromJSON(vars.SCGH_TIMEOUT_LINT || vars.MMGH_TIMEOUT_LINT || '45') }}

    env:
      BUILD_METAL: ${{ matrix.build_metal }}
      JOB_MAKE_ARGS: VERBOSE=1 BUILD_QT=ON USE_CLANG_TIDY=ON LINT_AS_ERRORS=ON
      # Cap parallelism. The github-hosted runners have only 3 (macOS) / 4
      # (ubuntu) virtual cores shared with co-tenant VMs, so letting NPROC
      # auto-detect oversubscribes memory and CPU; on the 7 GB arm64 macOS
      # runner clang-tidy then OOMs. NPROC drives both MAKE_PARALLEL (build)
      # and the lint targets (cformat xargs, flake8 --jobs), so capping it
      # here bounds every parallel step. 2 is the safe bet on both runners.
      NPROC: 2
      QT_DEBUG_PLUGINS: 1
      # QT_QPA_PLATFORM is set per-OS by the setup actions (xcb on Linux via
      # Xvfb, cocoa on macOS). Do not set it at the job level.
      PIP_BREAK_SYSTEM_PACKAGES: 1 # disabling PEP668 (for MacOS runner)
      # Fix issue: https://github.com/solvcon/solvcon/issues/366
      # Use custom config for jurplel/install-qt-action@v4
      AQT_CONFIG: "thirdparty/aqt_settings.ini"

    strategy:
      matrix:
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
        # macos-26 is arm64 with 7 GB RAM; parallelism is capped via NPROC
        # in the env block above so clang-tidy does not OOM.
        include:
          - os: ubuntu-24.04
            cmake_build_type: Debug
            build_metal: OFF
          - os: macos-26
            cmake_build_type: Debug
            build_metal: ON

      fail-fast: false

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: ${{ github.event_name == 'pull_request' && 100 || 1 }}

    - name: event name
      run: |
        echo "github.event_name: ${{ github.event_name }}"

    - name: setup dependencies for Linux
      if: runner.os == 'Linux'
      uses: ./.github/actions/setup_linux
      with:
        workflow: 'lint'

    - name: setup dependencies for macOS
      if: runner.os == 'macOS'
      uses: ./.github/actions/setup_macos
      with:
        workflow: 'lint'

    # Only a push reaches this cache. A pull request builds no pilot and runs
    # pilot_clang_tidy_diff instead, which drives clang-tidy and never the
    # compiler, so it compiles nothing and would pull close to a gigabyte down
    # for no hit at all.
    - name: ccache
      if: github.event_name != 'pull_request'
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }}-tidy-${{ matrix.cmake_build_type }}
        restore-keys: ${{ runner.os }}-tidy-${{ matrix.cmake_build_type }}
        # Bound the cache so it does not grow without limit across the rolling
        # key.
        max-size: 1500M

    - name: make cformat (clang-format check)
      run: |
        echo "::group::make cformat"
        make cformat
        echo "::endgroup::"

    - name: make cinclude (check_include)
      run: |
        echo "::group::make cinclude"
        make cinclude
        echo "::endgroup::"

    - name: make checkascii (check ASCII-only characters)
      run: |
        echo "::group::make checkascii"
        make checkascii
        echo "::endgroup::"

    - name: make checktws (check trailing whitespace)
      run: |
        echo "::group::make checktws"
        make checktws
        echo "::endgroup::"

    - name: make checktests (check test lane layout)
      run: |
        echo "::group::make checktests"
        make checktests
        echo "::endgroup::"

    - name: make flake8
      run: |
        echo "::group::make flake8"
        make flake8
        echo "::endgroup::"

    - name: make pilot
      if: github.event_name != 'pull_request'
      run: |
        echo "::group::make pilot"
        make pilot \
          ${JOB_MAKE_ARGS} \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3)"
        echo "::endgroup::"

    - name: make run_pilot_pytest
      if: github.event_name != 'pull_request'
      run: |
        echo "::group::make run_pilot_pytest"
        export LD_LIBRARY_PATH=$(python3 -c "import sys, os, shiboken6; sys.stdout.write(os.path.dirname(shiboken6.__file__))")
        # A runner has no desktop to take over, so let this job map its windows
        # and keep the tests that need a live surface out of the skips.
        export SOLVCON_TEST_SHOW_WINDOWS=ON
        make run_pilot_pytest \
          ${JOB_MAKE_ARGS} \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3)"
        echo "::endgroup::"

    - name: make pilot_clang_tidy_diff
      if: github.event_name == 'pull_request'
      run: |
        make pilot_clang_tidy_diff \
          ${JOB_MAKE_ARGS} \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3) -DCMAKE_EXPORT_COMPILE_COMMANDS=ON" \
          SOLVCON_DIFF_BASE=${{ github.event.pull_request.base.sha }}

    - name: make pilot_clang_tidy_diff with Python library path
      if: github.event_name == 'pull_request'
      run: |
        export LD_LIBRARY_PATH=$(python3 -c "import sys, os, shiboken6; sys.stdout.write(os.path.dirname(shiboken6.__file__))")
        make pilot_clang_tidy_diff \
          ${JOB_MAKE_ARGS} \
          CMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3) -DCMAKE_EXPORT_COMPILE_COMMANDS=ON" \
          SOLVCON_DIFF_BASE=${{ github.event.pull_request.base.sha }}
