name: nightly_profiling

on:
  push:
  pull_request:
  schedule:
    - cron: '34 17 * * *'
  workflow_dispatch:

jobs:
  profile:

    # Run profiling only on schedule, on a manual run, or when SCGH_FORCE_PROFILE is set to 'enable'
    # You can refer to https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-variables to set SCGH_FORCE_PROFILE in the fork repository settings for testing purposes.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (vars.SCGH_NIGHTLY || vars.MMGH_NIGHTLY) == 'enable') || (vars.SCGH_FORCE_PROFILE || vars.MMGH_FORCE_PROFILE) == 'enable' }}

    name: profile_${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: ${{ fromJSON(vars.SCGH_TIMEOUT_PROFILE || vars.MMGH_TIMEOUT_PROFILE || '30') }}

    env:
      # This job reads the compiler cache the devbuild build job saves and
      # saves none of its own, so it has to compile what that job compiled on
      # the same host. The matrix below mirrors that job's build type per
      # host; the two have to move together or every object misses.
      CMAKE_BUILD_TYPE: ${{ matrix.cmake_build_type }}
      QT_DEBUG_PLUGINS: 1
      # QT_QPA_PLATFORM is set per-OS by the setup actions (xcb on Linux via
      # Xvfb, offscreen on macOS). Do not set it at the job level.
      PIP_BREAK_SYSTEM_PACKAGES: 1 # disabling PEP668 (for MacOS runner)
      # Fix issue: https://github.com/solvcon/solvcon/issues/366
      # Use custom config for jurplel/install-qt-action@v4
      AQT_CONFIG: "thirdparty/aqt_settings.ini"

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            cmake_build_type: Release
          - os: macos-26
            cmake_build_type: RelWithDebInfo
      fail-fast: false

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: event name
        run: |
          echo "Event name: ${{ github.event_name }}"

      - name: setup dependencies for Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup_linux
        with:
          workflow: 'build'

      - name: setup dependencies for macOS
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup_macos
        with:
          workflow: 'build'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.cmake_build_type }}
          restore-keys: ${{ runner.os }}-${{ matrix.cmake_build_type }}
          save: false

      - name: make buildext BUILD_QT=ON
        run: |
          echo "::group::make buildext BUILD_QT=ON"
          make cmake \
            VERBOSE=1 USE_CLANG_TIDY=OFF \
            BUILD_QT=ON \
            CMAKE_ARGS="-DPYTHON_EXECUTABLE=$(which python3)"
          make buildext VERBOSE=1
          echo "::endgroup::"

      - name: make pyprof
        run: |
          echo "::group::make pyprof"
          make pyprof
          echo "::endgroup::"

  send_email_on_failure:
    needs: [profile]
    # Mail a nightly failure only, not one a force variable drove from a pull
    # request. A `timeout-minutes` kill reports `cancelled`, not `failure`.
    if: |
      always() &&
      (contains(needs.*.result, 'failure') ||
       contains(needs.*.result, 'cancelled')) &&
      github.event_name == 'schedule' &&
      github.event.repository.fork == false
    uses: ./.github/workflows/send_email_on_fail.yml
    with:
      job_results: |
        - profile: ${{ needs.profile.result }}
    secrets:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
