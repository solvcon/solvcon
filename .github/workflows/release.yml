name: release

# Pushing a vX.Y.Z tag builds, packs, and tests the pilot, then drafts the
# GitHub release for a maintainer to review and publish. A manual run does the
# same work on any ref and keeps the result as a workflow artifact only, for
# testing the workflow or a pre-release. doc/source/devguide/release.md
# describes the process.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  macos-arm64:

    runs-on: macos-26
    timeout-minutes: 120

    permissions:
      contents: write

    env:
      # The compiler is part of what makes a build reproducible, so do not
      # follow the image default.
      XCODE_VERSION: '26.6'

    steps:

    - uses: actions/checkout@v6
      with:
        # git describe names a manual build, and checktag looks up master.
        fetch-depth: 0

    - name: select Xcode
      run: |
        sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
        xcodebuild -version

    - name: name the release by its tag
      if: github.ref_type == 'tag'
      run: echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

    - name: make bundle-check-tag
      if: github.ref_type == 'tag'
      run: make bundle-check-tag

    - name: make bundle-prepare
      run: make bundle-prepare

    - name: make bundle
      run: make bundle

    - name: make bundle-test
      run: make bundle-test

    - name: make bundle-unbox-test
      run: make bundle-unbox-test

    - name: make bundle-info
      run: make bundle-info

    - name: make bundle-manifest
      run: make bundle-manifest

    - name: upload release files
      uses: actions/upload-artifact@v7
      with:
        name: pilot-macos-arm64
        path: |
          build/pilot-*-macos-arm64.dmg
          build/pilot-*-macos-arm64.dmg.sha256
          build/pilot-*-macos-arm64.build-info.md
          build/pilot-*-macos-arm64.manifest.txt
        if-no-files-found: error

    - name: draft the GitHub release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        base="build/pilot-${GITHUB_REF_NAME}-macos-arm64"
        gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
          --title "${GITHUB_REF_NAME}" --generate-notes \
          --notes-file "${base}.build-info.md" \
          "${base}.dmg" "${base}.dmg.sha256" "${base}.manifest.txt"
