name: release

# Build, package, and unbox-test the release artifacts. A pushed version tag
# runs the whole pipeline and drafts a GitHub release from it; a manual run
# exercises the same stages on any ref without publishing anything.
#
# Each stage is a `make bundle*` target, so it can be rerun by hand.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build (default: the run ref)'
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  build:

    name: build_package_${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: ${{ fromJSON(vars.SCGH_TIMEOUT_RELEASE || '90') }}

    strategy:
      matrix:
        # The aqt bundler supports Apple Silicon only.
        include:
          - os: macos-26

      fail-fast: false

    outputs:
      release_dmg: ${{ steps.name.outputs.release_dmg }}

    steps:

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          # git describe needs the tags and the history between them.
          fetch-depth: 0

      # The version is the pushed tag, or for a manual run what git describe
      # derives from the nearest tag: <tag>-<commits since>-g<hash> for a
      # commit that is not tagged. The DMG's file name is set here only. The
      # later steps read it from RELEASE_DMG, and the later jobs from the
      # release_dmg output.
      - name: name
        id: name
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always)"
          fi
          name="pilot-$version.dmg"
          echo "RELEASE_DMG=$name" >> "$GITHUB_ENV"
          echo "release_dmg=$name" >> "$GITHUB_OUTPUT"

      - name: setup
        run: |
          make bundle-prepare
          make bundle-precheck

      # rcc embeds each resource's modification time, which is the checkout
      # time for a source and the build time for a generated shader; it uses
      # SOURCE_DATE_EPOCH instead when set, so two builds of a commit match.
      - name: build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make bundle RELEASE_OUTPUT=dist RELEASE_DMG="$RELEASE_DMG"

      - name: package
        run: |
          (cd dist && shasum -a 256 "$RELEASE_DMG" > "$RELEASE_DMG.sha256")
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  unbox_test:

    # Install nothing beyond the runner image, so the test sees the artifact
    # the way a user's clean machine would and catches a missing dependency
    # that the build host happened to provide.
    needs: [build]

    name: unbox_test_${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    env:
      RELEASE_DMG: ${{ needs.build.outputs.release_dmg }}

    strategy:
      matrix:
        include:
          - os: macos-26

      fail-fast: false

    steps:

      # The tests need the Makefile, the bundler, and the GUI tests only.
      # Leaving solvcon/ out keeps the GUI tests on the bundled package. Cone
      # mode matches directories, not files, hence off.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          sparse-checkout: |
            Makefile
            contrib/bundle/bundle-with-aqt.sh
            tests/conftest.py
            tests/gui/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ matrix.os }}
          path: dist/

      - name: unbox test
        run: |
          (cd dist && shasum -a 256 -c "$RELEASE_DMG.sha256")
          make bundle-test RELEASE_ARTIFACT="dist/$RELEASE_DMG"

      # Run the GUI tests in the app even when the verification above failed,
      # so each check reports on its own.
      - name: gui test
        if: success() || failure()
        run: |
          make bundle-guitest RELEASE_ARTIFACT="dist/$RELEASE_DMG"

  publish:

    # Only a tag push publishes, and only as a draft, so a maintainer reviews
    # the notes and the assets before the release becomes public.
    needs: [build, unbox_test]

    if: github.ref_type == 'tag'

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    env:
      RELEASE_DMG: ${{ needs.build.outputs.release_dmg }}

    permissions:
      contents: write

    steps:

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/$RELEASE_DMG" "dist/$RELEASE_DMG.sha256" \
            --repo "${{ github.repository }}" \
            --draft --verify-tag --generate-notes \
            --title "${{ github.ref_name }}"
